                      - text: Thinking that searching, finding, and extracting of digital evidence is a job that can be given to a non-technical user plus AI is quite the risky experiment.
                      - text: Admitting AI generated derivative evidence without human expert analysis is something I hope to never see. Would we admit DNA evidence based solely on the say so of an LLM? Would we accept a ballistic report without the expert analysis of a human? Would we be OK with presenting a case with an AI lawyer or an AI prosecutor at the table? INTRODUCING DIGITAL EVIDENCE CAN'T BE THE EXCEPTION!!!
                      - text: How many cases will end up in basic pleas because important evidence was missed?
                      - text: How can meaning be discerned when the process used to get there is hidden behind this black box technology?
                      - text: It is a salient fact that LLMs aren't optional now. They're already embedded in too many systems, workflows, and products to avoid. The question is under what conditions and with what controls. We need to talk way more about this and we don't.
