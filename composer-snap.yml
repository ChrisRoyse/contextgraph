            - textbox "Text editor for creating content" [ref=e1849]:
              - paragraph [ref=e1850]: 🔭 Two things I'm genuinely excited to share.
              - paragraph [ref=e1918]
              - paragraph [ref=e1919]: This Saturday I'm giving a talk for the Information Physics Institute, and my new paper is now live on ResearchGate.
              - paragraph [ref=e1920]
              - paragraph [ref=e1921]: 📅 IPI Talk — Saturday, June 6, 17:00 London (12pm ET)
              - paragraph [ref=e1922]: "\"A Fourth Kind of Compression — Decomposing a Fixed Corpus Through Frozen Instruments, and Its Bridge to the Second Law of Infodynamics\""
              - paragraph [ref=e1923]: "Live stream: https://youtube.com/live/XY_YJiukBe8"
              - paragraph [ref=e1924]
              - paragraph [ref=e1925]: "Hosted by Dr. Melvin Vopson and the IPI. The core reframe: a trained embedder, frozen, is a designable measurement instrument. Project one fixed corpus through a panel of N frozen, approximately-independent instruments and you get up to N + C(N,2) + 1 structured supervisory signals per input — no synthetic data, structurally outside the model-collapse regime. I call the density of that extraction meaning compression, and propose it as a fourth category alongside bit-, weight-, and activation-compression."
              - paragraph [ref=e1926]
              - paragraph [ref=e1927]: "The same frozen panel then becomes a geometric alignment target — a constellation of identity centroids a generator is trained to land inside, with every output verified geometrically. Measured results I'll show: a voice reproduced at 0.961 mean speaker-embedding similarity (encoder-matched — I'll state that caveat plainly), a style model that holds character under adversarial prompting (public weights), running across three production panels of 7, 13, and 21 instruments."
              - paragraph [ref=e1928]
              - paragraph [ref=e1929]: "📄 New paper: \"Meaning Compression and the Calculus of Association: Frozen Embedders as Designable Measurement Instruments, Derived Data Abundance, and Teleological Constellation Training\""
              - paragraph [ref=e1930]: https://www.researchgate.net/publication/405865780
              - paragraph [ref=e1931]
              - paragraph [ref=e1932]: Come for the talk, scrutinize the numbers, tell me where I'm wrong — that's the point.
