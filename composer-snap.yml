                      - text: Day 10 of the
                      - link "Kansas State University College of Business" [ref=e354] [cursor=pointer]:
                        - /url: https://www.linkedin.com/company/kstatebusiness/
                        - strong [ref=e356]: Kansas State University College of Business
                      - text: "Germany & Netherlands Study Abroad Program gave students two outstanding examples of Dutch innovation: global flower logistics and connected cycling technology. 🇳🇱🌷🚴‍♂️"
                      - text: We began the day at
                      - link "Royal FloraHolland" [ref=e357] [cursor=pointer]:
                        - /url: https://www.linkedin.com/company/floraholland/
                        - strong [ref=e359]: Royal FloraHolland
                      - text: in Aalsmeer, widely recognized as the world’s largest flower auction and one of the most fascinating logistics operations we have seen on the trip. Students got a firsthand look at how flowers and plants move through a highly coordinated marketplace that connects growers, buyers, digital platforms, cold chain logistics, and rapid distribution across Europe and beyond.
                      - text: "The flower auction is an incredible supply chain case study: highly perishable products, global sourcing, real-time pricing, quality control, speed, automation, and intense pressure to move products quickly while preserving freshness and value. It is one thing to talk about perishability and time-sensitive logistics in class; it is another to watch thousands of carts of flowers moving through a massive facility before most of the city has started its workday."
                      - text: Later, we visited
                      - link "Tacx International B.V." [ref=e360] [cursor=pointer]:
                        - /url: https://www.linkedin.com/company/tacx-international-b.v./
                        - strong [ref=e362]: Tacx International B.V.
                      - text: (a
                      - link "Garmin" [ref=e363] [cursor=pointer]:
                        - /url: https://www.linkedin.com/company/garmin/
                        - strong [ref=e365]: Garmin
                      - text: company), where students learned about the evolution of Tacx from a Dutch cycling company into a major part of Garmin’s connected fitness ecosystem. The visit connected product design, manufacturing, indoor training technology, software, sensors, data, and the global cycling market in a way that was especially meaningful after our e-bike experience earlier in the week.
                      - text: A huge thank you to
                      - link "Simon Tacx" [ref=e366] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/simontacx/
                        - strong [ref=e368]: Simon Tacx
                      - text: and
                      - link "Sander Wansink" [ref=e369] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/sander-wansink-803b912/
                        - strong [ref=e371]: Sander Wansink
                      - text: for spending so much time with our students, sharing the company’s story, answering questions, and giving us such a thoughtful and engaging tour. Their hospitality was exceptional, and the opportunity to learn directly from people so connected to the product, the company, and the cycling industry made the visit truly memorable.
                      - text: Days like this are exactly why study abroad matters. Students are seeing how operations, technology, logistics, innovation, and customer experience come together in real organizations serving global markets.
