[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipcannon"
version = "0.1.0"
description = "AI-powered video understanding and editing pipeline via MCP"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "ClipCannon Team" },
]

dependencies = [
    # Core MCP
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.110.0",
    "python-jose[cryptography]>=3.3.0",
    # Image processing
    "Pillow>=10.0.0",
    # Processing
    "numpy>=1.26.0",
    "scipy>=1.11.4",
    # Billing
    "stripe>=8.0.0",
    # Vector search
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
ml = [
    # ML models - install separately as they are large
    "torch>=2.3.0",
    "faster-whisper>=1.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "demucs>=4.0.0",
    "librosa>=0.10.0",
]

phase2 = [
    # Audio processing
    "pydub>=0.25.0",
    # ML models for Phase 2
    "typed-ffmpeg>=3.0.0",
    "mediapipe>=0.10.0",
    "ace-step>=0.1.0",
    "midiutil>=1.2.1",
    "pyfluidsynth>=1.3.0",
    "pedalboard>=0.9.0",
]

phase3 = [
    # Avatar / lip-sync (LatentSync 1.6)
    "diffusers>=0.32.0",
    "omegaconf>=2.3.0",
    "einops>=0.7.0",
    "kornia>=0.8.0",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.20.0",
    "decord>=0.6.0",
    "accelerate>=0.26.0",
    "DeepCache>=0.1.1",
    # Voice (Qwen3-TTS)
    "soundfile>=0.12.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
clipcannon = "clipcannon.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clipcannon", "src/license_server", "src/phoenix", "src/voiceagent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "TCH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/train_cogvideo_lora.py" = ["E402", "N812"]
"scripts/train_santa_lipsync.py" = ["E402", "N806", "N812"]
"src/phoenix/render/flame_fitter.py" = ["N806", "N812"]
"src/phoenix/render/flame_model.py" = ["N803", "N806"]
"src/phoenix/render/math_utils.py" = ["N806", "N812"]
"src/phoenix/video/gpu_guard.py" = ["E402"]
"tests/fsv_pipeline_tools.py" = ["E402"]
"tests/integration/manual_verify.py" = ["E402"]
"tests/**" = ["ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
