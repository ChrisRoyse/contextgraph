                  - paragraph [ref=e773]:
                    - generic [ref=e774]:
                      - text: "There's a Simpsons episode where Homer monitors a nuclear plant from home. His only job: press Y when the system asks if everything's fine. He sets a drinking bird toy on the key and leaves for the afternoon. The bird falls over, and the plant explodes. That's the habit we're building with AI. Two Fortune 50 companies just learned what happens when you stop reviewing what your agents deliver, and neither caught it through monitoring. They discovered the damage by accident: • An airline's AI canceled thousands of flights • A financial firm's AI misprocessed transactions For decades, work was tied to the person doing it. • Developers wrote the code • Underwriters priced the risk • Actuaries ran the models If something went wrong, you knew whom to blame. Now agents handle everything. The only job left is reviewing what they produce, a skill most of us never built. QA was always the thin layer at the end. The real work was the execution. Agents produce more in a day than a full team used to deliver in a week. And it doesn't look like rough drafts, but polished. So you approve the batch without reading past the first page and move on. We approve, and 99% of the time it's fine. But when that 1% hits, the only person responsible is the one who approved it."
