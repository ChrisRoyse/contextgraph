## Known Gotchas

| Gotcha | Workaround |
|--------|------------|
| `bincode + skip_serializing_if` = silent corruption | Use JSON for all optional/provenance fields |
| `RwLockReadGuard` (parking_lot) is `!Send` | Clone data, drop guard before `.await` |
| E2 uses sinusoidal PE of absolute Unix timestamp (fixed) | E2 vectors are unique per `created_at`; HNSW rebuild recomputes E2 from timestamps; persisted E2 HNSW skipped on startup |
| E7 raw cosine enters fusion unnormalized `[-1,1]` | Apply `(raw+1)/2` normalization before fusion |
| `additionalProperties:false` blocks unlisted params | Audit schema↔handler alignment; MCP drops silently |
| RocksDB requires ALL on-disk CFs opened | Delete old DBs when removing CFs |
| `floor_char_boundary` for UTF-8 slicing | `&str[..n]` panics on multi-byte; use `str.floor_char_boundary(n)` |
| E5 embedder_scores=0.0 without CausalDirection | Set `CausalDirection::Cause` when E5 is selected |
| `kill(pid,0)` returns 0 for zombies | Check `/proc/pid/status` for `State:\tZ` |
| `suppress_degenerate_weights >0.0` drops valid zeros | E5=0.0 for non-causal is legitimate; don't filter |
| Hard-delete: HNSW before RocksDB = data loss on failure | Persist to RocksDB first, then remove from HNSW |
| `read_line_bounded` must drain remainder | After rejecting over-limit line, drain to `\n` or EOF |
| Soft-delete state lost on restart (in-memory HashMap) | Persist soft-delete flags to RocksDB `CF_SYSTEM` prefix keys |
| Importance clamping bypassed by serde deserialization | Clamp at MCP handler level, not just constructor |
| `ModelId` has 14 variants but `NUM_EMBEDDERS=13` | Kepler is 14th ModelId sharing E11 weight slot; MODEL_COUNT != NUM_EMBEDDERS |
| Schema defaults can mismatch handler defaults | Audit schema↔handler default alignment (e.g., decayFunction) |
| Session filtering not in store layer | Post-filter via `source_metadata.session_id` after retrieval |
| PQ-8 hardcoding `[-1,1]` range corrupts dequantization | Store actual per-column min/max from data |
| Clone `request.id` BEFORE consuming in timeout wrappers | `tokio::time::timeout` moves the future, losing access to request fields |
| JSON-RPC notifications: `result: Some(json!({}))` leaks | Must return all-None response for transport suppression |

