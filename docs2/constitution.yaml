## Conventions

| Scope | Convention |
|-------|-----------|
| Functions | snake_case (`create_hnsw_index`, `search_multi_space_sync`) |
| Types | PascalCase (`TeleologicalFingerprint`, `SourceMetadata`) |
| Constants | SCREAMING_SNAKE_CASE (`CF_FINGERPRINTS`, `TOTAL_COLUMN_FAMILIES`) |
| CF strings | lowercase_underscore (`"fingerprints"`, `"source_metadata"`) |
| Modules | snake_case (`teleological`, `rocksdb_store`) |
| Files | One primary type per module; keep under 500 lines |

**Patterns**:
- Error handling: `thiserror` derives, `ContextGraphError` with `From<>` conversions, `map_err()` over `.expect()`
- Concurrency: `parking_lot::RwLock/Mutex` (non-poisoning), consistent lock ordering
- Tests: `#[cfg(test)] mod tests` co-located; integration tests in `tests/`
- Serialization: JSON CFs (source_metadata, audit_log, merge_history, etc.) vs bincode CFs (e12_late_interaction, code_e7_embeddings)

## Anti-Patterns

| Do NOT | Do Instead | Why |
|--------|-----------|-----|
| Use bincode with `skip_serializing_if` | JSON for optional fields | Silent field corruption |
| Compare E1 scores with E5 scores | Apples-to-apples: E1↔E1 only | Different scales/semantics |
| Hold RwLockReadGuard across `.await` | Clone data, drop guard, then await | Guard is !Send — deadlock |
| Use E12 for initial retrieval | E12 for reranking only (stage 5) | MaxSim too slow for recall |
| Use weighted sum for multi-space fusion | Weighted RRF (ARCH-21) | Sum loses rank information |
| E10 linear blend with E1 | Multiplicative boost: `E1 * (1 + boost)` | Linear makes E10 compete with E1 |
| Chunk code by word count | AST boundaries via tree-sitter | Loses syntactic structure |
| Panic in library code | `map_err()` + `ContextGraphError` | Unrecoverable in server |
| Quantize only one asymmetric vector | Quantize BOTH cause+effect/src+target vectors | Clone destroys dual-vector signal |
| Override only some trait methods in adapter | Override ALL intercepted trait methods | Silent fallback to default impl loses data |
| Use `blanket #[allow(dead_code)]` on modules | Allow only on specific items with justification | Hides real dead code from audits |

## Security

- **Secrets**: Env vars only (`CONTEXT_GRAPH_STORAGE_PATH`); never in source
- **Input**: Validate all MCP tool params at handler boundary (JSON schema + custom validation)
- **Paths**: Sanitize file paths — prevent directory traversal in file watcher and code indexer
- **GPU**: CUDA bounds checking — validate embedding dimensions before kernel launch
- **Audit**: All destructive ops (delete, repair, reconcile) emit append-only audit records

