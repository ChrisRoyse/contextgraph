## [OPTIONAL] Embedders — 13 Perspectives

| ID | Name | Dim | Type | Finds | Topic Wt |
|----|------|-----|------|-------|----------|
| E1 | V_meaning | 1024 | Dense | Semantic similarity (foundation) | 1.0 |
| E2 | V_freshness | 512 | Dense | Recency — how recently stored (AI adjusts freely) | AI-controlled |
| E3 | V_periodicity | 512 | Dense | Periodicity — time-of-day/day-of-week patterns (AI adjusts freely) | AI-controlled |
| E4 | V_ordering | 512 | Dense | Sequence — conversation position ordering (AI adjusts freely) | AI-controlled |
| E5 | V_causality | 768 | Asymmetric | Causal chains (cause→effect) | 1.0 |
| E6 | V_selectivity | ~30K | Sparse | Exact keyword matches | 1.0 |
| E7 | V_correctness | 1536 | Dense | Code patterns, function signatures | 1.0 |
| E8 | V_connectivity | 1024 | Asymmetric | Graph structure (imports, deps) | 0.5 |
| E9 | V_robustness | 1024 | HDC | Noise-robust (typos, variations) | 0.5 |
| E10 | V_multimodality | 768 | Asymmetric | Paraphrase detection | 1.0 |
| E11 | V_factuality | 768 | Dense | Entity knowledge (KEPLER/TransE) | 0.5 |
| E12 | V_precision | per-token | ColBERT | Exact phrase (rerank ONLY) | 1.0 |
| E13 | V_keyword_precision | ~30K | SPLADE | Term expansion (recall ONLY) | 1.0 |

**Asymmetric**: E5 (cause→effect 1.2x, effect→cause 0.8x), E8 (source→target 1.2x), E10 (multiplicative boost: E1 * (1 + boost))
**MultiSpace active**: [E1, E2*, E3*, E4*, E5, E7, E8, E9, E10, E11] via RRF (* = when weight > 0.0)

## [OPTIONAL] Search Strategies

| Strategy | Pipeline | When |
|----------|----------|------|
| E1Only | E1 cosine | Fast simple semantic (default) |
| MultiSpace | E1+E2*+E3*+E4*+E5+E7+E8+E9+E10+E11 → RRF | Multi-perspective (up to 10 embedders, * when weight > 0.0) |
| Pipeline | E13 recall → E1 dense → E12 rerank | Max precision (3-stage) |
| EmbedderFirst | Any single embedder as primary | Specific perspective |

**Query type auto-detection**: CAUSAL (why/caused→E5,E8), CODE (::,→,fn→E7,E6), ENTITY (what is, names→E11,E6), KEYWORD (quotes, error:→E6,E13)

