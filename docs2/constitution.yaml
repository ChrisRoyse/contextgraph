## Identity

| Field | Value |
|-------|-------|
| Project | context-graph |
| Version | 8.2.0 |
| Updated | 2026-02-25 |
| Domain | 13-perspective GPU-first knowledge graph with semantic memory retrieval |
| Stack | Rust 2021 (MSRV 1.75) / RocksDB (51 CFs) / Candle 0.9.2-alpha (CUDA) / Axum 0.8 |
| Repository | https://github.com/org/context-graph |

**What**: GPU-resident knowledge graph using 13 embedding perspectives for multi-space semantic memory search, exposed via 56 MCP JSON-RPC tools across 11 workspace crates. 14 audits completed (368+ findings fixed, 0 remaining).

## Critical Rules

1. TeleologicalArray is atomic — all 13 embeddings or nothing _(why: partial arrays corrupt search fusion)_
2. JSON for provenance/metadata/audit; bincode for dense vectors ONLY _(why: bincode + skip_serializing_if = silent corruption)_
3. Drop RwLockReadGuard before .await _(why: parking_lot guards are !Send — deadlocks tokio)_
4. Temporal embedders E2 (recency), E3 (periodicity), E4 (sequence) are three independent time dimensions — the AI may freely adjust each weight independently via customWeights or create_weight_profile to match query intent (e.g., E2=0.5 for "what did I store yesterday", E3=0.4 for "what do I usually do on Mondays", E4=0.6 for "what came right before this"). Default semantic profiles keep E2-E4 at 0.0; temporal profiles or custom weights activate them _(why: temporal proximity across recency, periodicity, and sequence are orthogonal retrieval signals that the AI should compose freely)_
5. E12 reranking only; E13 recall only — never interchange _(why: AP-74/AP-75 — wrong stage destroys precision)_
6. additionalProperties:false on ALL MCP tool schemas _(why: unlisted params silently dropped)_
7. NEVER commit secrets, credentials, or .env files _(why: security)_
8. ALWAYS read a file before editing it _(why: prevents blind overwrites)_
9. GPU mandatory for production — all 13 embedders warm-loaded at startup _(why: CPU fallback 100x slower)_
10. Audit writes non-fatal — warn! on failure, never block main operation _(why: observability must not degrade core path)_

