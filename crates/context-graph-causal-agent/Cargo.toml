[package]
name = "context-graph-causal-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Causal relationship scanning and E5 activation utilities"

[features]
default = []
# Retired 2026-05-09: local LLM causal discovery was removed in the ME-JEPA pivot.
llm = []
cuda = []

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rand.workspace = true

# Internal crates
context-graph-core = { path = "../context-graph-core" }
context-graph-storage = { path = "../context-graph-storage" }
context-graph-embeddings = { path = "../context-graph-embeddings" }

# Async utilities
parking_lot = "0.12"

# Regex for fallback parsing
regex = "1"

# SHA-256 hashing for prompt template provenance
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tracing-subscriber = "0.3"
serial_test = "3"
