[package]
name = "context-graph-mejepa-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Clean-room ME-JEPA-Code mutation corpus generator (Phase 0 mutation operators) for ContextGraph"
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
context-graph-mejepa-instruments = { path = "../context-graph-mejepa-instruments" }
ctrlc = "3.4"
fs2 = "0.4"
rocksdb = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tree-sitter = "0.26"
tree-sitter-python = "0.23.6"

[dev-dependencies]
tempfile = "3.10"
