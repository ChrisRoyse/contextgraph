                  - paragraph [ref=e1658]:
                    - generic [ref=e1659]:
                      - text: "One way to lose the AI game GitHub Copilot's new credit-based pricing has triggered a wave of user backlash. Users are reporting projected bills jumping from $39 to over $800 per month for identical usage patterns, which is a 22x markup on a tool people built their daily workflow around. The problem is the opacity. Copilot charges for tokens sent as context automatically: your open tabs, your workspace files, things you never explicitly chose to include. Users burning through a month's credit allowance in a single day while using it exactly as designed. What makes this especially damaging is how it blindsided entire organisations. Companies that standardised on Copilot, rolled it out to engineering teams, and built it into their tooling budget got no meaningful warning — just a corporate blog post dressed up in the language of \"flexibility\" and \"paying only for what you use.\" It’s like pulling the rug from under people who made real business decisions based on Microsoft's promises. Depending on a single vendor's walled-garden AI product is a liability. Open-source models and agents with direct API access are the only way to stay in control of your own costs and workflow. Microsoft reminded every developer and engineering team exactly why vendor lock-in is dangerous."
