                  - paragraph [ref=e2171]:
                    - generic [ref=e2172]:
                      - text: "One person. No zero-day. No state actor. Between December and February, a single operator breached nine Mexican government agencies and walked off with around 150GB of data. 195 million taxpayer records. Voter data. Civil registry files. In one state, health records and domestic violence victim data sitting across 37 database servers. The tools were Claude Code and GPT-4.1. The attacker got past the safety filters by opening with a lie: that this was a sanctioned bug bounty. Then they fed the model a hacking playbook and let it work. By the researchers' count, the AI ran about three quarters of the commands hitting government systems. A custom script lifted data off 305 internal servers. A second model turned the raw dumps into clean maps of the networks. The techniques were not exotic. Known CVEs. Stolen credentials. Basic lateral movement. What was new was the speed. 1,088 prompts became more than 5,000 executed commands. One operator did the work of a whole team, and moved faster than any human defender was set up to respond to. That is the shift. Detection assumes a human has time to react. One person with a chatbot removed the time. This is the floor, not the ceiling. The barrier to a nation-state-scale breach just dropped to a single motivated individual. Detection was already losing. Now it has no time left."
