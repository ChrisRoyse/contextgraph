            - textbox "Text editor for creating content" [ref=e2890]:
              - paragraph [ref=e2891]: "You're handed a single photo of a code change and asked one question: will it pass its tests? You can't run it. You can only read the photo."
              - paragraph [ref=e2892]
              - paragraph [ref=e2893]: That is exactly what every AI code reviewer is doing — and in my new paper I measured how much of the answer is actually in the photo. The result was humbling.
              - paragraph [ref=e2894]
              - paragraph [ref=e2895]: "Map it out:"
              - paragraph [ref=e2896]: "- The embeddings are the camera."
              - paragraph [ref=e2897]: "- The model reading them is the person."
              - paragraph [ref=e2898]: "- The test suite — the \"oracle\" — is reality."
              - paragraph [ref=e2899]
              - paragraph [ref=e2900]: "\"Pass or Fail\" is about 1 bit of information. A sharp-enough photo would carry it. The photo our system takes carries ~0.46 bits. It's blurry — and worse, it's a photo of the wrong subject: what the code looks like, not what it does."
              - paragraph [ref=e2901]
              - paragraph [ref=e2902]: "Here's the part that changes how you build: it's a hard law, not an opinion (the data-processing inequality). No matter how smart the reader, you cannot read an answer off a photo that doesn't contain it. A bigger model can't fix a blurry photo. You have to fix the camera."
              - paragraph [ref=e2903]
              - paragraph [ref=e2904]: So the paper argues you should measure whether your representation even carries the answer BEFORE you train anything — a single falsifiable test (the mutual information between representation and oracle). It grounds this in symbol-grounding theory (Harnad's dictionary-go-round; the ~1% "grounding kernel") and reports the measured negative result on real Python patches against a Docker test oracle.
              - paragraph [ref=e2905]
              - paragraph [ref=e2906]: If you build AI evaluators, world models, or anything that "predicts reality," this paper will change where you point your effort.
              - paragraph [ref=e2907]
              - paragraph [ref=e2908]: Read it here 👇
              - paragraph [ref=e2909]: https://www.researchgate.net/publication/405975883_The_Oracle_and_the_Kernel_A_Falsifiable_Substrate-Bounded_Theory_of_Domain_Super-Intelligence_The_Deterministic_Oracle_as_Grounding_Anchor_the_Minimum_Grounding_Set_as_the_One-Percent_Kernel_and_an_In
