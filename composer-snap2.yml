                      - text: "'s team just proved the \"useless\" distribution is the only one that builds a working world model."
                      - text: Everything you learned in Independent Component Analysis (ICA) says the Gaussian is the bad case. It's the one distribution where you can't separate the sources. For 30 years that was the rule.
                      - text: A new paper flips it for JEPA-style world models.
                      - text: "The setup: the world has hidden variables, joint angles, the physical state of a scene. You never see them. A camera or sensor scrambles them into pixels. You train an encoder to map pixels back. Does it recover the real structure, or does it tangle position with color?"
                      - text: "Their answer is an if and only if:"
                      - text: → LeJEPA recovers the true latents (up to rotation) only if those latents are Gaussian.
                      - text: → And the Gaussian is the unique distribution that works. Every non-Gaussian alternative breaks it.
                      - text: Both directions. The forward proof is a spectral argument on Hermite polynomials, any nonlinear distortion strictly lowers the correlation between two views, so the optimum is forced to be linear. The converse rules out every other distribution.
                      - text: "The part nobody can wave away: all four theorems are formally verified in Lean 4. Zero sorry. 8,032 build targets. This isn't \"we ran it and it looked right.\" It's machine-checked."
                      - text: "Here's the uncomfortable implication for anyone training world models: your data collection decides whether the theory holds."
                      - text: "Sample like an isotropic random walk and you're safe. Run a goal-directed policy, which collapses onto a low-entropy manifold, and your representations warp. They show exactly this on a robot Reacher: random sampling recovers the joints, the RL policy doesn't."
                      - text: "Which raises the real question: are the latents we actually care about Gaussian?"
