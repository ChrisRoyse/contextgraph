[domain]
id = "contextgraph_swe_reality_loop_v1"
version = "1.0.0"
title = "ContextGraph SWE Reality Loop - Tool Transition Dynamics"
schema_version = 1

[time]
field = { name = "ts_ms", kind = "i64", required = true, min = 0 }

[[state.fields]]
name = "counter"
kind = { type = "i64" }
required = true
min = -10000
max = 10000

[[action.fields]]
name = "delta"
kind = { type = "i64" }
required = true
min = -10
max = 10

[[outcome.fields]]
name = "next_counter"
kind = { type = "i64" }
required = true
min = -10000
max = 10000

[[entity.fields]]
name = "trajectory_id"
kind = { type = "string" }
required = true

[[instruments]]
id = "tool_progress_counter"
kind = { type = "scalar" }
input_fields = ["state.counter"]
output_shape = [1]
normalization = { type = "standard_score", mean = 0.0, std = 32.0 }
required = true
pair_kinds = ["cosine"]
version = 1
[instruments.validation]
require_finite = true
reject_nan = true
reject_inf = true
min = -10000.0
max = 10000.0

[[instruments]]
id = "tool_utility_delta"
kind = { type = "scalar" }
input_fields = ["action.delta"]
output_shape = [1]
normalization = { type = "standard_score", mean = 0.0, std = 5.0 }
required = true
pair_kinds = ["cosine"]
version = 1
[instruments.validation]
require_finite = true
reject_nan = true
reject_inf = true
min = -10.0
max = 10.0

[[instruments]]
id = "observed_progress_counter"
kind = { type = "scalar" }
input_fields = ["outcome.next_counter"]
output_shape = [1]
normalization = { type = "standard_score", mean = 0.0, std = 32.0 }
required = true
pair_kinds = ["cosine"]
version = 1
[instruments.validation]
require_finite = true
reject_nan = true
reject_inf = true
min = -10000.0
max = 10000.0

[[adapters]]
id = "json_event"
kind = "json_event"
version = 1
[adapters.mapping]
"state.counter" = "$.state.counter"
"action.delta" = "$.action.delta"
"outcome.next_counter" = "$.outcome.next_counter"
"time.ts_ms" = "$.ts_ms"
"entity.trajectory_id" = "$.trajectory_id"

[[objectives]]
id = "predict_next_tool_progress"
kind = "latent_delta"
input_panel = "state_action"
target = "outcome.next_counter"
loss_weight = 1.0
required_dataset_fields = ["target_panel_id", "input_panel_id", "action_id"]

[[invariants]]
id = "tool_progress_conservation"
expression = "outcome.next_counter == state.counter + action.delta"
severity = "fatal"

[dataset_policy]
default_split = "by_time"
default_objective = "predict_next_tool_progress"
negative_sampling = "same_domain_different_outcome"
min_negatives_per_row = 1

[planner_policy]
candidate_actions = { kind = "enumerated", deltas = [-4, -2, 0, 2, 4, 7] }
guards = ["bounds_check"]
surprise_threshold = 0.85

[verification_policy]
required_cfs = [
  "dj_domain_packs", "dj_raw_events", "dj_adapter_runs",
  "dj_normalized_states", "dj_actions", "dj_outcomes", "dj_transitions",
  "dj_instrument_readings", "dj_latent_panels",
  "dj_trajectories", "dj_dataset_shards",
  "dj_training_runs", "dj_model_artifacts",
  "dj_predictions", "dj_plan_traces", "dj_guard_decisions",
  "dj_surprise_events", "dj_verification_runs", "dj_audit_log"
]
expected_trajectory_count = 1
expected_event_count = 60
expected_panel_count = 60
expected_dataset_row_count = 59
expected_train_rows_min = 41
expected_train_rows_max = 41
expected_val_rows_min = 12
expected_val_rows_max = 12
expected_test_rows_min = 6
expected_test_rows_max = 6
