[[objectives]]
id = "predict_next_tool_progress"
kind = "latent_delta"
input_panel = "state_action"
target = "outcome.next_counter"
loss_weight = 1.0
required_dataset_fields = ["target_panel_id", "input_panel_id", "action_id"]

[[invariants]]
id = "tool_progress_conservation"
expression = "outcome.next_counter == state.counter + action.delta"
severity = "fatal"

[dataset_policy]
default_split = "by_time"
default_objective = "predict_next_tool_progress"
negative_sampling = "same_domain_different_outcome"
min_negatives_per_row = 1

[planner_policy]
candidate_actions = { kind = "enumerated", records = [
  { delta = -4, tool_family = "workspace_mutation", command_kind = "apply_unified_diff", edit_size_bucket = "large", path_risk = "multiple", target_path_bucket = "multiple", symbol_bucket = "module", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" },
  { delta = -2, tool_family = "verification", command_kind = "run_targeted_test", edit_size_bucket = "none", path_risk = "none", target_path_bucket = "tests", symbol_bucket = "test_case", dependency_layer = "test_harness", test_target_kind = "unit", ownership_bucket = "tests" },
  { delta = 0, tool_family = "repository_navigation", command_kind = "list_files", edit_size_bucket = "none", path_risk = "source", target_path_bucket = "source", symbol_bucket = "module", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" },
  { delta = 2, tool_family = "repository_navigation", command_kind = "search_repo", edit_size_bucket = "none", path_risk = "source", target_path_bucket = "source", symbol_bucket = "function", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" },
  { delta = 4, tool_family = "repository_navigation", command_kind = "open_file_window", edit_size_bucket = "none", path_risk = "source", target_path_bucket = "source", symbol_bucket = "module", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" },
  { delta = 6, tool_family = "workspace_mutation", command_kind = "apply_structured_edit", edit_size_bucket = "small", path_risk = "source", target_path_bucket = "source", symbol_bucket = "function", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" },
  { delta = 7, tool_family = "workspace_mutation", command_kind = "apply_line_window_edit", edit_size_bucket = "small", path_risk = "source", target_path_bucket = "source", symbol_bucket = "function", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" },
  { delta = 5, tool_family = "workspace_mutation", command_kind = "apply_unified_diff", edit_size_bucket = "medium", path_risk = "source", target_path_bucket = "source", symbol_bucket = "module", dependency_layer = "unknown", test_target_kind = "none", ownership_bucket = "application" }
] }
guards = ["bounds_check"]
surprise_threshold = 0.85

[constellation.global]
modalities = [
  "state_tool_family",
  "repo_dirty_state",
  "prompt_version",
  "model_id",
  "state_primary_path_bucket",
  "state_symbol_bucket",
  "state_dependency_layer",
  "state_test_target_kind",
  "state_error_signature",
  "state_ownership_bucket",
  "action_tool_family",
  "command_kind",
  "edit_size_bucket",
  "path_risk",
  "action_target_path_bucket",
  "action_symbol_bucket",
  "action_dependency_layer",
  "action_test_target_kind",
  "action_ownership_bucket",
  "outcome_label",
  "result_status",
  "verifier_status",
  "test_failure_class",
  "incident_code",
  "correction_required",
  "outcome_file_risk",
  "outcome_error_signature",
  "outcome_symbol_bucket",
  "outcome_dependency_layer",
  "outcome_test_target_kind",
  "outcome_ownership_bucket"
]
require_loo_min = 0.70
calibration_percentile = 10
calibration_set_size = 12

[verification_policy]
required_cfs = [
  "dj_domain_packs", "dj_raw_events", "dj_adapter_runs",
  "dj_normalized_states", "dj_actions", "dj_outcomes", "dj_transitions",
  "dj_instrument_readings", "dj_pairwise_readings", "dj_latent_panels",
  "dj_trajectories", "dj_dataset_shards",
  "dj_training_runs", "dj_model_artifacts",
  "dj_constellations", "dj_threshold_calibrations",
  "dj_predictions", "dj_plan_traces", "dj_guard_decisions",
  "dj_surprise_events", "dj_verification_runs", "dj_audit_log"
]
expected_trajectory_count = 1
expected_event_count = 60
expected_panel_count = 60
expected_dataset_row_count = 59
expected_train_rows_min = 41
expected_train_rows_max = 41
expected_val_rows_min = 12
expected_val_rows_max = 12
expected_test_rows_min = 6
expected_test_rows_max = 6
