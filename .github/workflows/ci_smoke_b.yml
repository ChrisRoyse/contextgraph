name: DynamicJEPA CI Smoke B

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamicjepa-smoke-b-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CUDA_COMPUTE_CAP: "120"
  CUDA_HOME: /usr/local/cuda-13.2
  ONET_TEXT_ZIP: tmp/onet_probe/db_30_2_text.zip
  MEJEPA_CI_RUN_ROOT: tmp/mejepa_local_ci_runs

jobs:
  smoke-b:
    name: Tier B Local Free Nightly
    runs-on: [self-hosted, linux, x64, dynamicjepa-ci]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run local free Tier B gate
        run: scripts/5090jepa/local_ci_gate.sh smoke-b
