name: DynamicJEPA CI Smoke A

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "crates/context-graph-dynamicjepa/**"
      - "crates/context-graph-cli/src/commands/dynamicjepa.rs"
      - "configs/dynamicjepa/**"
      - "Cargo.lock"
      - "Dockerfile"
      - "docs/5090jepa/smokedocs/**"
      - "reference/**"
      - "scripts/5090jepa/local_ci_gate.sh"
  push:
    branches: [main, develop]
    paths:
      - "crates/context-graph-dynamicjepa/**"
      - "crates/context-graph-cli/src/commands/dynamicjepa.rs"
      - "configs/dynamicjepa/**"
      - "Cargo.lock"
      - "Dockerfile"
      - "docs/5090jepa/smokedocs/**"
      - "reference/**"
      - "scripts/5090jepa/local_ci_gate.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamicjepa-smoke-a-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CUDA_COMPUTE_CAP: "120"
  CUDA_HOME: /usr/local/cuda-13.2
  ONET_TEXT_ZIP: tmp/onet_probe/db_30_2_text.zip
  MEJEPA_CI_RUN_ROOT: tmp/mejepa_local_ci_runs

jobs:
  smoke-a:
    name: Tier A Local Free Smoke
    runs-on: [self-hosted, linux, x64, dynamicjepa-ci]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run local free Tier A gate
        run: scripts/5090jepa/local_ci_gate.sh smoke-a
